[package]
name = "engin"
version = "0.1.0"
edition.workspace = true
description = "End-user UCI chess engine: search + xiangqi_core + NN backend (ONNX)."
publish = false
default-run = "engin"

[features]
# 本机默认 DirectML；CUDA 只由独立脚本构建，二者不混入同一二进制。
default = ["directml"]
directml = ["ort/directml", "ort/download-binaries", "ort/copy-dylibs", "ort/tls-native"]
cuda = ["ort/cuda", "ort/load-dynamic", "ort/api-24"]
# 仅基准诊断：队列等待、collision 深度与 in-flight 分布不进入正式 UCI 热路径。
benchmark = []

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "graph_shape"
path = "src/bin/graph_shape.rs"
required-features = ["benchmark"]

[dependencies]
crossbeam-channel = "0.5"
ndarray = "0.17"
nohash-hasher = "0.2"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray"] }
parking_lot = "0.12"
xiangqi_core = { path = "../xiangqi_core" }
