[package]
name = "engin"
version = "0.1.0"
edition.workspace = true
description = "End-user UCI chess engine: search + xiangqi_core + NN backend (ONNX). No dataset tooling."
publish = false
default-run = "engin"

[dependencies]
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
xiangqi_core = { path = "../xiangqi_core" }
