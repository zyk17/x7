[package]
name = "engin"
version = "0.1.0"
edition.workspace = true
description = "End-user UCI chess engine: search + xiangqi_core + NN backend (ONNX). No dataset tooling."
publish = false

[dependencies]
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "cuda", "directml"] }
serde_json = "1.0.149"
xiangqi_core = { path = "../xiangqi_core" }
