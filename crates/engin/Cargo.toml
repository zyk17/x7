[package]
name = "engin"
version = "0.1.0"
edition.workspace = true
description = "End-user UCI chess engine: search + xiangqi_core + NN backend (ONNX)."
publish = false
default-run = "engin"

[dependencies]
crossbeam-channel = "0.5"
ndarray = "0.17"
nohash-hasher = "0.2"
ort = { version = "2.0.0-rc.12", features = ["directml", "download-binaries"] }
parking_lot = "0.12"
quick_cache = "0.6.22"
xiangqi_core = { path = "../xiangqi_core" }
