[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-review-nn"
version = "0.2.0"
description = "Chinese chess human policy model (XRSH → ResNet → ONNX)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tqdm>=4.65",
]

[project.optional-dependencies]
train = [
  "torch>=2.0",
  "onnx>=1.16",
]
dev = ["pytest>=7.0", "onnx>=1.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
