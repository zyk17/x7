[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-review-nn"
version = "0.2.0"
description = "Chinese chess px0-style policy/value training and ONNX export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tqdm>=4.65",
]

[project.optional-dependencies]
train = [
  "torch>=2.0",
  "onnx>=1.16",
  "kagglehub>=0.3",
]
dev = ["pytest>=7.0", "onnx>=1.16", "ruff>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
extend-select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
