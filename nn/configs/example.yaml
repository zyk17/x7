# X7 v3 Transformer PX0 训练配置模板。
# 训练入口只接受：python scripts/train/train_px0.py --config <this-file>
# 路径相对于启动命令所在目录解析；仓库根目录启动时，data/... 即为仓库 data/。

# 仅写入 checkpoint 元数据和日志，建议与 training.out 的文件名一致。
name: example

dataset:
  # Kaggle pikacat/px0data 的版本号；本地目录为 C:/work/px0data/{version}/。
  px0_version: "677"
  # 本地版本缓存根目录。目录已有完整 manifest/chunk 时不访问 Kaggle。
  px0_root: "C:/work/px0data"
  # 固定文件级 train/validation 切分中 validation 的比例，必须在 (0, 1)。
  val_ratio: 0.05
  # 每次 validation 使用的固定局面数。首次训练会生成并持久化 record-level manifest；
  # 此后所有 validation 读取同一批局面，曲线可以横向比较。
  validation_samples: 16384
  # 首次构建 manifest 时允许扫描的 validation chunk 上限。0 表示按固定随机顺序扫描，
  # 达到三档配额即停止；正数用于限制初始化成本。
  validation_source_files: 0
  # 文件切分随机种子。改变它会生成另一份 train/validation manifest。
  seed: 42
  # 仅 prepare_px0.py 使用：true 会删除此版本已准备的 chunk/archive/manifest 后重新下载；通常保持 false。
  force_download: false

model:
  # v3：90 个棋盘 token 的 PX0/Lc0 AttentionBody。每层是 MHA + Smolgen + LayerNorm + FFN。
  # policy 由起点-终点 token pair score 收集回固定 2062 PX0 着法顺序；正式输出契约不变。
  # 只接受本实现名：x7_v3_attentionbody 或 x7_v2_bottleneck_gbroadcast。
  # 两者 checkpoint 不兼容，不能互相 init_from 或续训。
  kind: x7_v3_attentionbody
  width: 512
  blocks: 12
  # 32 channels/head 与 Lc0 默认 AttentionBody 保持同一量级。
  heads: 16
  # Lc0 的 dff=1.5*d_model；这里保持同一比例。
  ffn_channels: 768

training:
  # 一个 YAML 对应一个模型 checkpoint。文件存在时自动续训。
  out: "data/checkpoints/example.pt"
  # init_from 只载入模型权重，并从 step 0 创建新的优化器和学习率日程；需要完整续训时，先复制
  # 原 checkpoint 到新的 out 路径。
  # init_from: "data/checkpoints/x7_v3_transformer.best.pt"
  # 全局总 step，不是本次增加的 step。续训时必须大于 checkpoint 的 completed_steps。
  steps: 2000
  # 每个 optimizer step 的样本数。
  batch_size: 256
  # 每隔多少 step 跑一次 validation 并写 checkpoint。
  eval_every: 100
  # pxzero-style record shuffle buffer 的总大小；会按 DataLoader worker 均分，避免顺序读取
  # 同一对局相邻局面。4096 个解码样本约占 200 MB 主存。
  shuffle_size: 4096
  # AdamW：线性 warmup 后平滑 cosine 衰减，不使用人工 lr boundaries。
  warmup_steps: 250
  lr: 0.0003
  min_lr_scale: 0.1
  # Conv/Linear weights decay；BatchNorm 与 bias 不 decay。
  weight_decay: 0.0001
  # PX0 self-play/search targets 的离线训练。`policy` 是 root-child visit
  # distribution，`root_wdl` 是完成搜索后的 root_q/root_d；final result 和
  # plies-left 是结果锚点。未来以本网络生成新数据后，才构成完整 RL 闭环。
  final_value_loss_weight: 0.6
  root_wdl_loss_weight: 0.6
  # 剩余 ply 是 value 的间接辅助；v677 小网络对照中 0.5 优于 1.0。
  moves_left_loss_weight: 0.5
  # 第二 policy head 使用同一搜索分布的 T=4 软化目标，仅训练期使用。
  soft_policy_weight: 8.0
  soft_policy_temperature: 4.0
  # CUDA trunk FP16 autocast，heads/loss FP32。
  amp: true
  # cuda: 必须有 CUDA，缺失即失败；cpu: 强制 CPU；auto: CUDA 不可用时允许回退 CPU。
  device: cuda
  # DataLoader worker 数。null 使用平台默认值；Windows 本机常用 4。
  num_workers: 4
